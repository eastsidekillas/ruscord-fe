name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # What ships to browsers must have no known vulnerabilities; build and
      # test tooling is reported by `npm audit` but does not reach users.
      - run: npm audit --omit=dev
      # The production build: AOT templates, budgets, and no requests outside
      # the repository (fonts are bundled).
      - run: npm run build
      - run: npm run test:ci

  # The client against the real core, both in Docker (e2e/ci.sh).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: ruscord-fe }
      # Public now; if the repository becomes private, this needs a token
      # with read access to it (repository secret).
      # A ruscord-core branch named like this one goes with it (a change that
      # needs both repositories); otherwise main.
      - id: pair
        run: |
          b="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/eastsidekillas/ruscord-core "$b" >/dev/null; then ref="$b"; else ref=main; fi
          echo "ruscord-core: $ref"; echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with: { repository: eastsidekillas/ruscord-core, ref: '${{ steps.pair.outputs.ref }}', path: ruscord-core }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ruscord-fe/package-lock.json
      - run: npm ci
        working-directory: ruscord-fe
      - run: npx playwright install --with-deps chromium
        working-directory: ruscord-fe
      - run: ruscord-fe/e2e/ci.sh ruscord-core ruscord-fe
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: ruscord-fe/e2e/failures/
