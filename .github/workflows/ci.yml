name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The production build: AOT templates, budgets, and no requests outside
      # the repository (fonts are bundled).
      - run: npm run build
      - run: npm run test:ci
