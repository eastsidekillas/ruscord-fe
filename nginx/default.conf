# The client and ruscord-core on one origin: cookies (SameSite) and the
# gateway's Origin check need it. "core" is the ruscord-core service
# (RUSCORD_HTTP_ADDR=0.0.0.0:8080); its RUSCORD_ALLOWED_ORIGINS must list
# this site's origin.
upstream core_upstream {
    server core:8080;
}

server {
    listen 80;
    server_name _;
    root /app/frontend;
    index index.html;

    # Uploads (avatars, icons) are up to 8 MiB.
    client_max_body_size 9m;

    server_tokens off;

    location / {
        try_files $uri /index.html;
        # The page may run only its own scripts and talk only to its own
        # origin; nobody may frame it (clickjacking). Component styles are
        # inline <style> elements, hence 'unsafe-inline' for styles only.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self'; connect-src 'self' ws://$http_host wss://$http_host; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=()" always;
    }

    location /api/ {
        proxy_pass http://core_upstream;
        include proxy_params;
    }

    # Files are immutable; the core sets the caching and security headers.
    location /cdn/ {
        proxy_pass http://core_upstream;
        include proxy_params;
    }

    location = /gateway {
        proxy_pass http://core_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s; # heartbeats come every 30 s
        include proxy_params;
    }
}
