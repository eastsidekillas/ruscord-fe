<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Zvonilka</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="app-icon.svg">
  <style>
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0F1112;
      transition: opacity .4s ease, visibility .4s ease;
    }
    #app-splash.splash-hide {
      opacity: 0;
      visibility: hidden;
    }
    #app-splash-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      animation: splash-in .5s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes splash-in {
      from { opacity: 0; transform: translateY(16px) scale(.95); }
      to   { opacity: 1; transform: translateY(0)   scale(1); }
    }
    #app-splash-title {
      font-family: 'Manrope Variable', Manrope, system-ui, sans-serif;
      font-size: 28px;
      font-weight: 600;
      color: #EDEFF0;
      letter-spacing: -.02em;
    }
    #app-splash-dots {
      display: flex;
      gap: 6px;
    }
    #app-splash-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #7FB2E5;
      animation: splash-dot 1.2s ease-in-out infinite;
    }
    #app-splash-dots span:nth-child(2) { animation-delay: .2s; }
    #app-splash-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes splash-dot {
      0%, 80%, 100% { opacity: .25; transform: scale(.8); }
      40%           { opacity: 1;   transform: scale(1); }
    }
  </style>
</head>
<body class="bg-ok-bg text-ok-text font-sans">

  <div id="app-splash">
    <div id="app-splash-inner">
      <img src="app-icon.svg" alt="" width="88" height="88">
      <span id="app-splash-title">zvonilka</span>
      <div id="app-splash-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <!-- A file, not an inline script: the Content-Security-Policy allows only scripts from this origin. -->
  <script src="splash.js"></script>

  <app-root></app-root>
</body>
</html>
